[project]
name = "eth-wallet-model"
version = "0.1.0"
description = "dbt model of Ethereum ERC-20 transfers for wallet investigations"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "dbt-bigquery>=1.10",
    "duckdb>=1.4",
    "loguru>=0.7",
    "pendulum>=3.0",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "sqlfluff>=3.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/**" = ["S101"]
# Column lists are module constants, never user input
"scripts/extract.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
addopts = "--cov=extract --cov-report=term-missing --cov-fail-under=80"
